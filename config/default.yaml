app:
  name: AiMate
  version: 1.0.0
  environment: development
  timezone: Asia/Seoul
  language: ko-KR
character: seoa # CLI 기본 선택. Discord Host는 목록 전체 실행.
characters:
  - id: seoa
    connections:
      discord: {}
      cli: {}
    settings: {} # ai/conversation/messages/humanize/features/tools의 캐릭터별 덮어쓰기
ai:
  decision:
    provider: gateway
    model: parallel/parallel-decisions-fast # AI Gateway Decision 모델
    prompt: default
    timeoutMs: 10000
    providerOptions: {}
  vertex:
    projectId: "" # VERTEX_PROJECT_ID 환경 변수로도 지정 가능
    location: global
  chat:
    provider: vertex
    model: gemini-3.8-flash
    nativeTools:
      webSearch: false
      webScraping: false
    prompt: default
    # null인 생성 옵션은 SDK에 전달하지 않는다.
    temperature: null
    maxOutputTokens: null
    topP: null
    topK: null
    maxRetries: 3
    providerOptions: {}
  embedding:
    provider: gateway
    model: null
  summary:
    provider: gateway
    model: openai/gpt-5-mini
  image:
    provider: gateway
    model: openai/gpt-image-2
    prompt: default
    includeTimeContext: true
    maxRetries: 3
    providerOptions: {}
conversation:
  responseMode: buffer # buffer: 기존 방식(API 불필요), decision: 참여 여부 판단
  maxContextMessages: 20
  maxHistoryDays: 30
  bufferTimeout: 5000 # ms
  decision:
    debounceMs: 1000 # 0: 입력을 모으는 예약 대기 없이 판단
    maxWaitMs: 5000
    recheckMs: 5000 # wait 후 첫 재평가 간격
    recheckMultiplier: 2 # wait가 이어질 때 간격 증가 배수 (> 1)
    maxRecheckMs: 30000 # 재평가 간격 상한, 새 입력 시 초기화
    maxContextMessages: 20
    maxContextTokens: 4000 # UTF-8 크기로 추정한 입력 예산, 정확한 토큰 수는 모델에 따라 다름
    character: "" # 참여 판단에 필요한 짧은 캐릭터 설명
    rules: "" # 프롬프트 팩의 기본 참여 규칙에 덧붙일 캐릭터별 규칙
messages:
  maxLength: 1900
humanize:
  enabled: true
  typingDelayMin: 1000
  typingDelayMax: 2000
  typingDelayPerChar: 60
logging:
  level: info
features:
  enableSlashCommands: true
  enableTextCommands: true
  enableDM: true
  enableChannelMention: true
tools:
  maxSteps: 5
